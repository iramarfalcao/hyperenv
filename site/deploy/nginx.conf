# HyperEnv site — nginx config for the container.
#
# The caching and security rules mirror site/_headers, which is the Netlify /
# Cloudflare Pages format and means nothing to nginx. Edit both together.

# Long caching is only for responses that found something. With `always`, a
# 404 for an asset that is not deployed *yet* got the year-long immutable
# header too, and Cloudflare kept serving that 404 after the file existed.
# Errors are marked no-store; an empty value makes nginx omit the header.
map $status $cache_ok { ~^(200|206|304)$ 1; default 0; }
map "$cache_ok:$cache_policy" $cache_control {
    ~^1:(?<policy>.+)$  $policy;
    ~^0:                "no-store";
    default             "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/hyperenv-security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/xml
               image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Filenames carry no content hash, so "immutable" holds only because a new
    # asset means a new image and the container is rebuilt from scratch.
    location /assets/ {
        include /etc/nginx/snippets/hyperenv-security-headers.conf;
        set $cache_policy "public, max-age=31536000, immutable";
        add_header Cache-Control $cache_control always;
    }

    location = /styles.css {
        include /etc/nginx/snippets/hyperenv-security-headers.conf;
        set $cache_policy "public, max-age=604800";
        add_header Cache-Control $cache_control always;
    }

    location = /copy.js {
        include /etc/nginx/snippets/hyperenv-security-headers.conf;
        set $cache_policy "public, max-age=604800";
        add_header Cache-Control $cache_control always;
    }

    # This one is piped straight into a shell, so a fix to it should reach
    # people quickly rather than sit in a CDN for a day. Plain text so it can be
    # read in a browser instead of downloaded — the whole point of telling
    # someone to inspect a script before running it.
    location ~ ^/(install\.sh|install-cli\.sh|install\.ps1)$ {
        include /etc/nginx/snippets/hyperenv-security-headers.conf;
        default_type text/plain;
        charset utf-8;
        set $cache_policy "public, max-age=300";
        add_header Cache-Control $cache_control always;
    }

    # One hour on the page itself: short enough that a copy fix is visible the
    # same afternoon, long enough that the CDN absorbs a traffic spike.
    location = / {
        include /etc/nginx/snippets/hyperenv-security-headers.conf;
        set $cache_policy "public, max-age=3600";
        add_header Cache-Control $cache_control always;
        try_files /index.html =404;
    }

    location / {
        set $cache_policy "";
        add_header Cache-Control $cache_control always;
        try_files $uri $uri/ =404;
    }
}
