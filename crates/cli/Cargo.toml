[package]
name = "hyperenv-cli"
description = "O comando hyperenv: perfis, aplicar e desfazer pelo terminal. A porta dos plugins."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hyperenv"
path = "src/main.rs"

[dependencies]
hyperenv-core = { path = "../core" }
hyperenv-engine = { path = "../engine" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
