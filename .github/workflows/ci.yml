name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core and shell checks
    # Pinned rather than macos-latest: the app targets the macOS 26 SDK, and a
    # runner rolling forward silently is not something a release should find
    # out about at tag time.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          swift --version

      # The Core layer does no I/O, so it compiles and runs straight from
      # swiftc — no app bundle, no test host, no simulator.
      - name: Core checks
        run: Tests/run-core-checks.sh

      # The check that actually matters: a real zsh in an isolated ZDOTDIR,
      # proving that sourcing the generated scripts produces the environment the
      # app promised, and that un-applying puts the old values back.
      - name: Shell integration
        run: Tests/run-shell-integration.sh

      # A view that demands more width than the window has does not fail loudly.
      # It renders with content pushed off screen, which reads as missing data.
      - name: Layout checks
        run: Tests/run-layout-checks.sh

      # An export that writes a header and no variables looks like success until
      # the file is opened.
      - name: Export checks
        run: Tests/run-export-checks.sh

  cask:
    name: Homebrew cask
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Homebrew refuses to lint a cask that is not inside a tap, so it gets a
      # throwaway one. This is here because the cask already went stale once:
      # `verified:` was deprecated out from under it, and nothing said so.
      - name: Lint the cask
        run: |
          brew tap-new hyperenv-ci/local --no-git
          tap="$(brew --repository)/Library/Taps/hyperenv-ci/homebrew-local"
          mkdir -p "$tap/Casks"
          cp Casks/hyperenv.rb "$tap/Casks/"
          brew style --cask hyperenv-ci/local/hyperenv

      # Online audit checks the release asset really exists and its checksum
      # matches the cask. Skipped on pull requests from forks, which have no
      # need to reach the network for this.
      - name: Audit the cask against the published release
        if: github.event_name != 'pull_request'
        run: brew audit --cask --online hyperenv-ci/local/hyperenv

  build:
    name: Build and package
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      # Exactly the script the release workflow runs, so a packaging break shows
      # up on a pull request instead of on a tag.
      - name: Build (universal, ad-hoc signed)
        run: Scripts/build-release.sh

      - name: Package a disk image
        run: Scripts/make-dmg.sh build/export/HyperEnv.app "ci-${GITHUB_SHA:0:7}"

      - uses: actions/upload-artifact@v7
        with:
          name: HyperEnv-dmg
          path: |
            build/*.dmg
            build/*.sha256
          retention-days: 14
