name: CI

on:
  push:
    branches: [main]
    # O plugin da família IntelliJ tem CI própria (plugin-build.yml). Este job
    # roda em runner macOS com Xcode; disparar por mudança de Kotlin é minuto
    # de runner gasto à toa.
    paths-ignore: ["plugins/**"]
  pull_request:
    paths-ignore: ["plugins/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core checks
    # Pinned rather than macos-latest: the app targets the macOS 26 SDK, and a
    # runner rolling forward silently is not something a release should find
    # out about at tag time.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          swift --version

      # The app's logic is HyperEnv's Rust core: the same suites the Rust
      # workflow runs on three systems, here on the macOS the app ships for —
      # including the end-to-end checks in a real zsh and bash.
      - name: Core, engine and command checks
        run: cargo test -p hyperenv-core -p hyperenv-engine -p hyperenv-cli -p hyperenv-ffi --locked -- --test-threads=1

  cask:
    name: Homebrew cask
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Homebrew refuses to lint a cask that is not inside a tap, so it gets a
      # throwaway one. This is here because the cask already went stale once:
      # `verified:` was deprecated out from under it, and nothing said so.
      - name: Lint the cask
        run: |
          brew tap-new hyperenv-ci/local --no-git
          tap="$(brew --repository)/Library/Taps/hyperenv-ci/homebrew-local"
          mkdir -p "$tap/Casks"
          cp Casks/hyperenv.rb "$tap/Casks/"
          brew style --cask hyperenv-ci/local/hyperenv

      # Online audit checks the release asset really exists and its checksum
      # matches the cask. Skipped on pull requests from forks, which have no
      # need to reach the network for this.
      # Authenticated, or the audit shares the runner IP's anonymous quota with
      # every other job on GitHub's fleet and fails on "rate limit exceeded"
      # for reasons that have nothing to do with the cask.
      - name: Audit the cask against the published release
        if: github.event_name != 'pull_request'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew audit --cask --online hyperenv-ci/local/hyperenv

  build:
    name: Build and package
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      # Exactly the script the release workflow runs, so a packaging break shows
      # up on a pull request instead of on a tag.
      - name: Build (universal, ad-hoc signed)
        run: apps/macos/Scripts/build-release.sh

      - name: Package a disk image
        run: apps/macos/Scripts/make-dmg.sh apps/macos/build/export/HyperEnv.app "ci-${GITHUB_SHA:0:7}"

      - uses: actions/upload-artifact@v7
        with:
          name: HyperEnv-dmg
          path: |
            apps/macos/build/*.dmg
            apps/macos/build/*.sha256
          retention-days: 14
