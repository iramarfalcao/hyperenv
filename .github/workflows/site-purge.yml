name: Site cache purge

# Coolify deploys the site on every push to main (auto_deploy, homelab
# playbook-apps.yml), but nothing tells GitHub when the new container is live.
# So this waits until the live /build.txt — a hash the image computes over every
# file it serves (site/deploy/Dockerfile) — equals the same hash computed from
# this checkout, fetched with a unique query string so Cloudflare cannot answer
# from cache, and only then purges exactly the changed URLs. Purging earlier would let the
# CDN re-cache the old version from the container that is being replaced.

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

concurrency:
  group: site-purge
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE: https://hyperenv.falcaosl.com
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changed pages and assets
        id: changed
        run: |
          # A manual run purges every served file: a way to force a clean CDN.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git ls-files site | grep -vE '^site/(deploy/|README\.md$|_headers$)' > changed.txt
            echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base="HEAD~1"; fi
          # Deleted files have nothing to wait for; deploy/, README and _headers
          # are build inputs the Dockerfile never serves.
          git diff --name-only --diff-filter=AMR "$base" HEAD -- site \
            | grep -vE '^site/(deploy/|README\.md$|_headers$)' > changed.txt || true
          cat changed.txt
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Wait for the new deploy
        if: steps.changed.outputs.count != '0'
        run: |
          # Same recipe as the stamp stage in site/deploy/Dockerfile.
          want="$(cd site && find . -type f ! -path './deploy/*' ! -name _headers ! -name README.md \
            | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          echo "expecting build $want"
          deadline=$(( $(date +%s) + 20 * 60 ))
          until [ "$(curl -fsS "$SITE/build.txt?deploy=$GITHUB_SHA-$RANDOM" 2>/dev/null)" = "$want" ]; do
            [ "$(date +%s)" -ge "$deadline" ] && { echo "::error::the deploy did not go live within 20 minutes"; exit 1; }
            sleep 20
          done
          echo "origin serves this commit"

      - name: Purge from Cloudflare
        if: steps.changed.outputs.count != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          # index.html is also served as / — purge both spellings.
          urls="$(sed -e 's|^site/||' -e "s|^|$SITE/|" changed.txt)"
          grep -qx 'site/index.html' changed.txt && urls="$urls"$'\n'"$SITE/"
          # The API takes at most 30 URLs per call.
          printf '%s\n' "$urls" | split -l 30 - batch.
          for b in batch.*; do
            body="$(jq -Rn '{files: [inputs | select(length > 0)]}' < "$b")"
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$body" | jq -e '.success' >/dev/null
            echo "purged:"; cat "$b"
          done
