# Builds HyperEnv 2 — the desktop app's installers for Windows and Linux and
# the `hyperenv` command for macOS, Linux and Windows — and publishes them on
# a GitHub Release.
#
# Its own tag (`cli-v2.0.0-alpha.1`), separate from the app's `v*`: the 1.x
# installer downloads `releases/latest/download/HyperEnv.dmg`, so a CLI
# release must never become "latest" while the 1.x app is the shipping
# product. Every release made here is marked as a pre-release for that reason;
# `site/install-cli.sh` and `site/install.ps1` look these tags up by prefix.

name: CLI release

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. cli-v2.0.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: musl, so one static binary runs on any distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, archive: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, archive: zip }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, archive: zip }
          # macOS: both slices built here, joined into one universal binary below.
          - { target: aarch64-apple-darwin, os: macos-26, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-26, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        run: cargo build --release --locked -p hyperenv-cli --target ${{ matrix.target }}

      - name: Smoke test
        if: "!(matrix.target == 'x86_64-apple-darwin')"
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/hyperenv
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" version
          "$bin" --json --home "$RUNNER_TEMP/h" profiles

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/hyperenv
            target/${{ matrix.target }}/release/hyperenv.exe
          if-no-files-found: error

  # The desktop app's installers, each built on its own system:
  # NSIS (.exe, per-user) on Windows, .deb and AppImage on Linux.
  desktop:
    name: desktop ${{ matrix.arch }}-${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: windows, arch: x64, os: windows-2025, formats: nsis }
          - { system: windows, arch: arm64, os: windows-11-arm, formats: nsis }
          - { system: linux, arch: x64, os: ubuntu-24.04, formats: "deb,appimage" }
          - { system: linux, arch: arm64, os: ubuntu-24.04-arm, formats: "deb,appimage" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Linux build dependencies
        if: matrix.system == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libfuse2

      - name: cargo-packager
        shell: bash
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Package
        shell: bash
        run: cargo packager -p hyperenv-desktop --release -f ${{ matrix.formats }}

      - name: Rename
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#cli-v}"
          mkdir -p dist
          for f in target/packages/*; do
            case "$f" in
              *.exe)      cp "$f" "dist/HyperEnv-$version-windows-${{ matrix.arch }}-setup.exe" ;;
              *.deb)      cp "$f" "dist/hyperenv-desktop_${version}_${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}.deb" ;;
              *.AppImage) cp "$f" "dist/HyperEnv-$version-linux-${{ matrix.arch }}.AppImage" ;;
            esac
          done
          ls -la dist
          [ -n "$(ls dist)" ] || { echo "no package was produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.system }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, desktop]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bins

      - name: Package
        run: |
          set -euo pipefail
          version="${TAG#cli-v}"
          mkdir -p dist
          pack() { # target dir-with-binary
            name="hyperenv-$version-$1"
            mkdir -p "stage/$name"
            cp "$2"/hyperenv* "stage/$name/"
            cp LICENSE "stage/$name/"
            chmod +x "stage/$name"/hyperenv* || true
            if [[ "$1" == *windows* ]]; then
              (cd stage && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C stage -czf "dist/$name.tar.gz" "$name"
            fi
          }
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            pack "$t" "bins/bin-$t"
          done
          # One universal binary for macOS: the installer never has to ask.
          mkdir -p bins/universal
          lipo -create -output bins/universal/hyperenv \
            bins/bin-aarch64-apple-darwin/hyperenv bins/bin-x86_64-apple-darwin/hyperenv
          pack universal-apple-darwin bins/universal
          # The desktop installers are already named; they join the same sums.
          cp bins/desktop-*/* dist/
          (cd dist && shasum -a 256 -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "HyperEnv 2 preview ${TAG#cli-v}" \
              --notes "HyperEnv 2 preview: the desktop app for Windows (installer) and Linux (.deb, AppImage), and the \`hyperenv\` command for macOS, Linux and Windows.

          Install: \`curl -fsSL https://hyperenv.falcaosl.com/install-cli.sh | sh\` (macOS, Linux) or \`irm https://hyperenv.falcaosl.com/install.ps1 | iex\` (Windows PowerShell)."
          gh release upload "$TAG" dist/* --clobber
