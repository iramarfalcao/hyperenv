# Reposto ao unificar o hyperenv-idea-plugin aqui: aquele repositório tinha dez
# PRs de dependabot abertas e foi apagado. As de GitHub Actions eram dos
# workflows do template, hoje inertes; as de Gradle são reais e voltam por aqui.
# Minor e patch vêm num PR só por pasta; major continua em PR próprio, porque
# é o que pode quebrar a build.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /plugins/intellij
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "plugin"
    groups:
      minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /plugins/vscode
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "vscode"
    ignore:
      # Os tipos seguem engines.vscode (^1.85.0); subir os tipos obrigaria subir
      # o engines e deixaria Cursor e Windsurf, que andam atrás, sem o plugin.
      - dependency-name: "@types/vscode"
    groups:
      minor-patch:
        update-types: [minor, patch]
