[package]
name = "hyperenv-desktop"
description = "HyperEnv 2 for Windows and Linux (and macOS, for development): the window over the same engine as the command."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hyperenv-desktop"
path = "src/main.rs"

[dependencies]
hyperenv-core = { path = "../../crates/core" }
hyperenv-engine = { path = "../../crates/engine" }
slint = "1.18"
arboard = { version = "3", default-features = false }

[build-dependencies]
slint-build = "1.18"
serde_json = "1"
