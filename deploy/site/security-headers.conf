# Cabeçalhos de segurança, num arquivo à parte por uma regra do nginx: um
# `add_header` dentro de um `location` DESCARTA todos os herdados do `server`.
# Sem repeti-los em cada location que define Cache-Control, /assets/, /copy.js e
# a raiz sairiam sem CSP nenhum — e essas são justamente as rotas mais servidas.
#
# Espelha site/_headers, que é o formato de Netlify/Cloudflare Pages e o nginx
# não lê. Ao editar um, edite o outro: hosts diferentes servindo a mesma página
# com políticas diferentes é pior do que não ter política.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
