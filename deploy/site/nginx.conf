# HyperEnv site — nginx config for the container.
#
# site/_headers is the Netlify / Cloudflare Pages format and nginx does not
# read it. Every rule in that file is restated here; if you edit one, edit the
# other, or the two hosts will serve the page with different security headers.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No JavaScript, no web fonts, no external requests of any kind — the CSP
    # can therefore be this tight without breaking anything on the page.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; media-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/xml image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Fingerprint-free filenames, so assets are immutable only because they are
    # replaced wholesale on each deploy — a new image means a new deploy, and
    # the container is rebuilt from scratch either way.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /styles.css {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # One hour on the page itself: short enough that a copy fix is visible the
    # same afternoon, long enough that the CDN absorbs a traffic spike.
    location = / {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; media-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
